[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "coating-ai"
version = "0.2.0"
description = "设置驱动的实验机器学习、Pareto优化与指定目标反向推荐项目"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "botorch==0.18.1",
    "pandas>=2.2,<3",
    "openpyxl>=3.1,<4",
    "PyYAML>=6.0,<7",
    "scikit-learn>=1.5,<2",
    "scipy>=1.11,<2",
    "joblib>=1.3,<2",
]

[project.scripts]
coating-ai = "coating_ai.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
