# 这是整个项目唯一需要经常修改的设置文件。
project:
  name: coating_ai_example
  initial_design_size: 20

# 输入变量是实验中可以控制或选择的条件。
# type只支持continuous（连续）和integer（整数）。enabled=false可临时停用变量。
input_variables:
  A:
    type: continuous
    enabled: true
    bounds:
      enabled: true
      lower: 0.0
      upper: 10.0
      # bounds.enabled=false时，使用训练数据实际范围，并在两端各扩展此比例。
      observed_margin: 0.10
  B:
    type: continuous
    enabled: true
    bounds:
      enabled: true
      lower: 0.0
      upper: 10.0
      observed_margin: 0.10
  C:
    type: integer
    enabled: true
    bounds:
      enabled: true
      lower: 0
      upper: 10
      observed_margin: 0.10

# 目标变量是实验测得、希望模型预测和优化的结果。
# Pareto模式使用pareto_direction；target模式使用goal。
target_variables:
  X:
    enabled: true
    pareto_direction: maximize
    # 留空时，程序根据已测数据自动选择Pareto参考点。
    reference_value:
    goal:
      enabled: true
      mode: target
      value: 0.80
      tolerance: 0.25
      weight: 1.0
  Y:
    enabled: true
    pareto_direction: maximize
    reference_value:
    goal:
      enabled: true
      mode: at_least
      value: 0.00
      tolerance: 0.25
      weight: 1.0
  Z:
    enabled: true
    pareto_direction: minimize
    reference_value:
    goal:
      enabled: true
      mode: range
      lower: -0.50
      upper: 0.50
      tolerance: 0.25
      weight: 0.8

# 当前版本支持可开关的线性约束。operator只支持<=或>=。
constraints:
  enabled: true
  rules:
    - name: total_input_limit
      enabled: true
      coefficients:
        A: 1.0
        B: 1.0
        C: 1.0
      operator: <=
      rhs: 20.0

recommendation:
  # target：指定目标反向推荐；pareto：多目标Pareto优化。
  mode: target
  batch_size: 5
  candidate_pool_size: 2048
  seed: 42
  # target模式：值越大越偏好预测更确定的点；0表示只看预测均值。
  risk_aversion: 0.25
  # 同一批推荐点在归一化输入空间中的最小距离。
  diversity_min_distance: 0.05
  # Pareto参考点留空时，相对已观测最差值向外扩展的比例。
  auto_reference_margin: 0.10
